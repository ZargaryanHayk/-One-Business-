[project]
name = "ai-task-bot"
version = "1.0.0"
description = "Private Telegram task management with local voice transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "redis>=5,<8",
  "celery[redis]>=5.5,<6",
  "aiogram>=3.20,<4",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL and Redis", "transcription: requires downloaded Whisper weights"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
